aid: altair-semiconductor
name: Altair Semiconductor
description: 'Altair Semiconductor is a fabless semiconductor company that designs low-power, highly
  integrated cellular IoT chipsets. Its core products are the ALT1250 (a dual-mode LTE-M / NB-IoT modem
  and SoC with integrated iSIM, MCU and GNSS) and the ALT1350 (a next-generation 5G LPWA SoC that combines
  LTE-M/NB-IoT, unlicensed-spectrum and satellite NTN connectivity), used in smart meters, asset trackers,
  wearables, sensors and vehicle telematics. Altair was acquired by Sony in 2016, operated as Sony''s
  cellular IoT unit, and in 2026 was spun back out as an independent company with $50M in funding led by
  Pitango. This is a hardware/semiconductor provider: it ships chipsets, evaluation kits and datasheets
  rather than a public developer API, so it carries no OpenAPI, SDK, MCP or developer-portal surface to
  enrich.'
